<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--recuperar tema guardado antes de cargar los estilos-->
    <script>
        (() => {
            const initialTheme = localStorage.getItem("theme");
            if (initialTheme === "light" || initialTheme === "dark") {
                document.documentElement.setAttribute("data-theme", initialTheme);
            }
        })();
    </script>
    <title>Sistema de Gestión</title>
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--estilos propios-->
    <link rel="stylesheet" href="css/styles.css">
    <!--lucide icons-->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!--contenedor principal-->
    <div class="app-container">
        <!--fondo para cerrar el menú en dispositivos móviles-->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!--menú lateral-->
        <aside class="sidebar" id="sidebar">
            <!--identidad del sistema-->
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <i data-lucide="store"></i>
                </div>

                <div class="brand-info">
                    <h1>Sistema kiosco</h1>
                    <span>Gestión comercial</span>
                </div>
            </div>

            <!--navegacion-->
            <nav class="sidebar-nav">
                <span class="nav-section-title">GENERAL</span>

                <a href="#" class="nav-link active" data-view="dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>

                <a href="#" class="nav-link" data-view="ventas">
                    <i data-lucide="shopping-cart"></i>
                    <span>Ventas</span>
                </a>

                <span class="nav-section-title">GESTIÓN</span>

                <a href="#" class="nav-link" data-view="productos">
                    <i data-lucide="package"></i>
                    <span>Productos</span>
                </a>

                <a href="#" class="nav-link" data-view="inventario">
                    <i data-lucide="boxes"></i>
                    <span>Inventario</span>
                </a>

                <a href="#" class="nav-link" data-view="compras">
                    <i data-lucide="shopping-bag"></i>
                    <span>Compras</span>
                </a>

                <span class="nav-section-title">ADMINISTRACIÓN</span>

                <a href="#" class="nav-link" data-view="caja">
                    <i data-lucide="wallet"></i>
                    <span>Caja</span>
                </a>

                <a href="#" class="nav-link" data-view="reportes">
                    <i data-lucide="chart-no-axes-combined"></i>
                    <span>Reportes</span>
                </a>

                <a href="#" class="nav-link" data-view="usuarios">
                    <i data-lucide="users"></i>
                    <span>Usuarios</span>
                </a>

                <a href="#" class="nav-link" data-view="auditoria">
                    <i data-lucide="history"></i>
                    <span>Auditoría</span>
                </a>

            </nav>

            <!--configuración-->
            <div class="sidebar-footer">
                <a href="#" class="nav-link" data-view="configuracion">
                    <i data-lucide="settings"></i>
                    <span>configuración</span>
                </a>
            </div>
        </aside>

        <!--contenido principal-->
        <div class="main-container">
            <!--barra superior-->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="icon-button" id="sidebarToggle"
                            type="button" aria-label="Abrir o contraer menú"
                            aria-controls="sidebar" aria-expanded="true">
                        <i data-lucide="menu"></i>
                    </button>

                    <h2 id="pageTitle">Dashboard</h2>
                </div>

                <div class="topbar-right">
                    <button class="icon-button" id="themeToggle">
                        <i data-lucide="moon"></i>
                    </button>

                    <button class="icon-button">
                        <i data-lucide="bell"></i>
                    </button>

                    <div class="user-profile">
                        <div class="user-avatar">AA</div>

                        <div class="user-info">
                            <span>Ariel Alegre</span>
                            <small>Dueño</small>
                        </div>
                    </div>

                </div>

            </header>

            <!--área de trabajo-->
            <main class="main-content" id="mainContent">
                <!--aquí se cargaran las vistas-->
            </main>

        </div>

    </div>

    <!--bootstrap de js-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!--charts.js-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!--lucide-->
    <script>
        lucide.createIcons();
    </script>
    <!--js-->
    <script src="js/components.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/main.js"></script>

    <!--MÁSCARAS PARA LA TRANSICIÓN DE TEMA-->
    <svg width="0" height="0" aria-hidden="true">
        <defs>
            <!--cortina hacia abajo-->
            <clipPath id="wave-mask-down" clipPathUnits="objectBoundingBox">
                <path id="wave-down-path" d="M0,0 H1 V0
                       Q0.85,0.08 0.7,0
                       Q0.5,-0.08 0.3,0
                       Q0.15,0.08 0,0 Z">

                    <animate id="wave-down-animation" attributeName="d" begin="indefinite" dur="1.5s" calcMode="spline"
                        keyTimes="0;1" keySplines="0.42 0 0.58 1" fill="freeze" values="
                                M0,0 H1 V0 Q0.85,0.08 0.7,0 Q0.5,-0.08 0.3,0 Q0.15,0.08 0,0 Z;
                        M0,0 H1 V1 Q0.85,1.08 0.7,1 Q0.5,0.92 0.3,1 Q0.15,1.08 0,1 Z
                            ">
                </path>
            </clipPath>

            <!--cortina hacia arriba-->
            <clipPath id="wave-mask-up" clipPathUnits="objectBoundingBox">
                <path id="wave-up-path"
                    d="M0,1 H1 V1
                       Q0.85,0.92 0.7,1
                       Q0.5,1.08 0.3,1
                       Q0.15,0.92 0,1 Z">
                        <animate
                            id="wave-up-animation"
                            attributeName="d"
                            begin="indefinite"
                            dur="1.5s"
                            calcMode="spline"
                            keyTimes="0;1"
                            keySplines="0.42 0 0.58 1"
                            fill="freeze"
                            values="
                                M0,1 H1 V1 Q0.85,0.92 0.7,1 Q0.5,1.08 0.3,1 Q0.15,0.92 0,1 Z;
                                M0,1 H1 V0 Q0.85,-0.08 0.7,0 Q0.5,0.08 0.3,0 Q0.15,-0.08 0,0 Z
                            ">
                </path>
            </clipPath>

        </defs>
    </svg>
</body>

</html>
